CREATE STUDENT CLASS

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KV Dashboard - Create Student Class</title>
    <link rel="stylesheet" href="CreateStudentClass.css">
</head>
<body>

<aside id="sidebar">
    <div class="logo">
        <img src="WhatsApp Image 2026-01-11 at 12.37.08.jpeg" alt="Logo">
    </div>
    <div class="role-badge" id="display-role">Staff</div>
    <nav>
        <a href="../Dashboard/Dashboard.html"    class="nav-item">Dashboard</a>
        <a href="../delete-account/DeleteAccount.html" id="nav-account" class="nav-item">Account</a>
        <a href="../Student-Class/StudentClass.html"  class="nav-item active">Student Class</a>
        <a href="../Student-List/StudentList.html" class="nav-item">Student Profile</a>
        <a href="../Subject/Subject.html"  class="nav-item">Subject</a>
        <a href="../Create-Student-Absent-Record/Create-Student-Absent-Record.html" class="nav-item">Absent Records</a>
    </nav>
    <a href="#" onclick="logoutUser()" class="nav-item logout">Logout</a>
</aside>

<div id="main-wrapper">
    <header id="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <button onclick="toggleSidebar()" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">&#9776;</button>
            <span style="font-weight:500;">Intervention: Student Management System</span>
        </div>
        <div class="user-profile" onclick="window.location.href='profile.html'">
            <span id="user-fullname">Loading...</span>
            <div class="user-icon"><span id="user-initial">?</span></div>
        </div>
    </header>

    <div id="content">
        <div class="shadow-box">
            <h1 style="margin:0;">Create Student Class</h1>
            <div class="orange-bar"></div>

            <!-- IMPORTANT: Use onsubmit="handleForm(event)" to prevent refresh -->
            <form id="createForm" onsubmit="handleForm(event)">
                <div class="form-group">
                    <label for="classId">Class ID</label>
                    <input type="text" id="classId" placeholder="Example: 1SVM KPD" required>
                </div>

                <div class="form-group">
                    <label for="className">Class Name</label>
                    <input type="text" id="className" placeholder="Example: Computer Systems & Networking" required>
                </div>

                <div class="actions">
                    <button type="button" class="btn-cancel" onclick="window.location.href='StudentClass.html'">Cancel</button>
                    <button type="submit" class="btn-submit">Confirm</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="CreateStudentClass.js"></script>
</body>
</html>
