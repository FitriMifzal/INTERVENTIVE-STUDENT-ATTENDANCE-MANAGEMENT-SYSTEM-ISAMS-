<div id="main-wrapper">

    <header id="header">

        </div>

    <div class="container">
        <div class="form-card">
            <h2>Update Student Profile</h2>

            <div class="form-group">
                <label>Full Name</label>
                <input id="name">

            <div class="form-group">
                <label>IC Number</label>
                <input id="ic">
            </div>

            <div class="form-group">
                <label>Class</label>
                <input id="cls">
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea id="address"></textarea>
            </div>

            <div class="form-group">
                <label>Contact No</label>
                <input id="No">
            </div>
            <button class="submit-btn" onclick="saveUpdate()">Submit</button>
        </div>
    </div>
