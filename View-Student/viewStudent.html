<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Student Profile | KV Datuk Seri Mohd Zin</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="viewStudent.css">
</head>

<body>

    <aside id="sidebar">
        <div class="logo">
            <img src="../image/Logo Kolej Vokasional.jpeg" alt="KV Logo">
        </div>
        <div class="role-badge" id="display-role">STATUS</div>
        <nav>
            <a href="../Dashboard/Dashboard.html"    class="nav-item">Dashboard</a>
            <a href="../delete-account/DeleteAccount.html" id="nav-account" class="nav-item">Account</a>
            <a href="../Student-Class/StudentClass.html"    class="nav-item">Student Class</a>
            <a href="../Student-List/StudentList.html" class="nav-item active">Student Profile</a>
            <div class="nav-item">Subject</div>
        <div class="submenu">
            <a href="../Subject/Subject.html" class="sub-nav-item">Details Subject</a>
            <a href="../Enroll-Subject/Enroll-Subject.html" class="sub-nav-item">Enroll Students</a>
        </div>
            <a href="../Create-Student-Attendance/Create-Student-Attendance.html" class="nav-item">Student Attendance</a>
            <a href="../Calculate-Absent-Percentage/Calculate-Absent-Percentage.html" class="nav-item">Calculate Percentage</a>
        </nav>
        <div class="logout-section">
            <a onclick="logout()" class="nav-item">Logout</a>
        </div>
    </aside>

<div id="main-wrapper">

    <header id="header">
        <div style="display: flex; align-items: center; gap: 5px;">
            <button onclick="toggleSidebar()" style="background:none; border:none; color:white; font-size:24px; cursor:pointer; padding: 10px;">&#9776;</button>
            <div class="fw-bold fs-5" style="white-space: nowrap;">Intervention: Student Management System</div>
        </div>
        <div class="user-profile" onclick="window.location.href='profile.html'" title="View Profile">
            <span id="user-fullname" style="font-weight: 600;">Loading...</span>
            <div class="user-icon" id="user-initial">-</div>
        </div>
    </header>

    <div class="container">
        <div class="view-card">
            <h2>Student Details</h2>

            <div class="detail-row">
                <div class="detail-label">Full Name</div>
                <div class="detail-value" id="v_name">-</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">IC Number</div>
                <div class="detail-value" id="v_ic">-</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Class</div>
                <div class="detail-value" id="v_cls">-</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Home Address</div>
                <div class="detail-value" id="v_address">-</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Contact No</div>
                <div class="detail-value" id="v_No">-</div>
            </div>
           
        </div>
    </div>
</div>

<script src="viewStudent.js"></script>

</body>
</html>
