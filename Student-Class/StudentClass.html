<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Class | KV Dashboard</title>
    <link rel="stylesheet" href="StudentClass.css">
</head>
<body>

<aside id="sidebar">
    <div class="logo">
        <img src="WhatsApp Image 2026-01-11 at 12.37.08.jpeg" alt="Logo">
    </div>
    <div class="role-badge" id="display-role">Staff</div>
    <nav>
        <a href="../Dashboard/Dashboard.html" class="nav-item">Dashboard</a>
        <a href="../delete-account/DeleteAccount.html" id="nav-account" class="nav-item">Account</a>
        <a href="StudentClass.html" class="nav-item active">Student Class</a>
        <a href="../Student-List/StudentList.html" class="nav-item">Student Profile</a>
        <a href="../Subject/Subject.html" class="nav-item">Subject</a>
        <a href="../Create-Student-Absent-Record/Create-Student-Absent-Record.html" class="nav-item">Absent Records</a>
    </nav>
    <a href="#" onclick="logoutUser()" class="nav-item logout">Logout</a>
</aside>

<div id="main-wrapper">
    <header id="header">
        <button class="header-title" onclick="toggleSidebar()">
            <span class="menu-icon">&#9776;</span>
            <span class="header-text">Intervention: Student Management System</span>
        </button>
        <div class="user-profile" onclick="window.location.href='profile.html'">
            <span id="user-fullname">Loading...</span>
            <div class="user-icon"><span id="user-initial">?</span></div>
        </div>
    </header>

    <div class="container">
        <div class="table-card">
            <div class="top-actions">
                <div>
                    <h2>Student Class</h2>
                    <p class="subtitle">View your classes and update them from here.</p>
                </div>
                <div>
                    <button class="btn-action" onclick="goToCreate()">Create Class</button>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search class ID or name..." onkeyup="searchTable()">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Class ID</th>
                            <th>Class Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="classTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="StudentClass.js"></script>
</body>
</html>
