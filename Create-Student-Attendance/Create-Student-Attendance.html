<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Student Attendance | KVDSMZ</title>
    <link rel="stylesheet" href="Create-Student-Attendance.css">
</head>
<body>

    <div id="sidebar">
        <div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Logo_Kolej_Vokasional.png/640px-Logo_Kolej_Vokasional.png" alt="KV Logo">
        </div>

        <div class="role-badge">Subject Teacher</div>

        <div class="nav-menu">
            <button class="nav-item" onclick="navClick(this)">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                Dashboard
            </button>
            <button class="nav-item" onclick="navClick(this)">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Student Class
            </button>
            <button class="nav-item active" onclick="navClick(this)">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Student Profile
            </button>
            <button class="nav-item" onclick="navClick(this)">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                Subject
            </button>
            <button class="nav-item" onclick="navClick(this)">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Absent Records
            </button>
        </div>
    </div>

    <div id="main-wrapper">
        <div id="header">
            <div class="header-left">
                <button class="hamburger-btn">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <span>Intervention: Student Management System</span>
            </div>
            <div class="header-right">
                <span>th</span>
                <div class="user-avatar-circle">T</div>
            </div>
        </div>

        <div class="container">
            <div class="card">
                <div class="card-title">Student Attendance Spreadsheet Matrix</div>
                <p class="card-sub">File Context Reference: <strong style="color:#334155;">TRC501-PHM2453B1B2.xlsx</strong></p>

                <div class="legend-row">
                    <span style="font-weight:600; color:#334155;">Legend:</span>
                    <div class="legend-item">
                        <div class="legend-dot badge-present">✓</div>
                        <span>Present (Hadir)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot badge-absent">✗</div>
                        <span>Absent (Tidak Hadir)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot badge-reason">O</div>
                        <span>Absent with Reason (MC/Surat)</span>
                    </div>
                    <div class="legend-item" style="margin-left:auto; background:#fffbeb; border:1px solid #fcd34d; padding:5px 12px; border-radius:5px; color:#92400e; font-weight:600;">
                        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                        Only today's column is editable
                    </div>
                </div>

                <div class="toolbar-panel">
                    <input type="text" id="gridSearch" class="search-input" oninput="filterGrid()" placeholder="Search student by name or ID...">
                    <div class="btn-group-actions">
                        <button class="btn btn-save" onclick="saveGrid()">
                            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                            Save Changes
                        </button>
                        <button class="btn btn-export" onclick="exportGridCSV()">
                            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Export CSV
                        </button>
                        <button class="btn btn-reset" onclick="resetGrid()">Reset</button>
                    </div>
                </div>

                <div class="sheet-table-wrapper">
                    <table id="attendanceGrid">
                        <thead id="gridHead"></thead>
                        <tbody id="gridBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="Create-Student-Attendance.js"></script>
</body>
</html>
